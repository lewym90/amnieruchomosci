      </section>
      ${formBand('h-form', 'Mam mieszkanie do wynajęcia', '', form({ sciezka: 'najem', fields: [FIELD.imie, FIELD.kontakt, { name: 'lokalizacja', label: 'Dzielnica lub miejscowość', type: 'text', required: true, err: 'Wpisz dzielnicę albo miejscowość.' }, { name: 'zakres', label: 'Czego potrzebujecie', type: 'select', required: true, options: ['Znalezienie najemcy', 'Znalezienie najemcy i stała obsługa', 'Tylko stała obsługa'], err: 'Wybierz zakres.' }, FIELD.wiadomoscOpc], submit: 'Wyślij' }))}`
    };
  };

  /* ======================= O NAS ======================= */
  P['/o-nas'] = () => ({
    title: T('O nas'),
    desc: 'AM Nieruchomości prowadzą Michał Lewandowski i Agata Ceglińska. Jak pracujemy, czego nie robimy i kto za co odpowiada.',
    crumbs: [['O nas', '/o-nas']],
    schema: [agentSchema()],
    html: `
    ${head('O nas', 'Dlaczego powstało to biuro', '')}
    <section class="wrap reveal o-photo" aria-label="Zdjęcie współwłaścicieli">${pic('paraPoziom', { sizes: '(min-width:1440px) 1440px, 100vw', ratio: '3 / 2', eager: true })}</section>
    <section class="section wrap" aria-labelledby="h-dlaczego">
      <div class="split reveal">
        <div class="s-head"><h2 class="h2" id="h-dlaczego">Metoda</h2></div>
        <div class="s-body prose">
          <p class="lead">Przez lata pracowaliśmy w zawodzie, w którym nie wolno było niczego przyjąć na słowo. Każdy dokument trzeba było przeczytać do końca, każdą informację potwierdzić w co najmniej dwóch niezależnych źródłach. Nie dlatego, że byliśmy nieufni — dlatego, że konsekwencje pomyłki ponosił ktoś inny.</p>
          <p>Kiedy zaczęliśmy przyglądać się rynkowi nieruchomości, zobaczyliśmy coś, co nas zaskoczyło. Ludzie podejmują decyzje o kilkuset tysiącach złotych — często o całym swoim majątku — na podstawie zdjęć zrobionych telefonem, jednej wizyty i zapewnienia, że „dokumenty są w porządku”.</p>
        </div>
      </div>
    </section>
    <section class="section wrap" aria-labelledby="h-jak">
      <div class="split reveal">
        <div class="s-head"><h2 class="h2" id="h-jak">Jak pracujemy</h2></div>
        <div class="s-body prose">
          <p>Zanim wystawimy nieruchomość, sprawdzamy ją. To nie jest formalność ani punkt w ofercie — to jest pierwsze, co robimy, i czasem oznacza, że sprawy nie przyjmujemy albo że przez kilka tygodni porządkujemy dokumenty, zanim w ogóle pojawi się ogłoszenie.</p>
          <p>Sprawdzamy księgę wieczystą w całości, ze wszystkimi działami i wzmiankami. Ustalamy obciążenia, hipoteki, służebności i roszczenia. Badamy podstawę nabycia, a przy nieruchomościach spadkowych — pełny krąg spadkobierców i stan postępowań. Weryfikujemy zadłużenie wobec wspólnoty lub spółdzielni oraz dostawców mediów. Porównujemy stan faktyczny z dokumentacją: metraż, układ, zmiany, samowole. Potwierdzamy tożsamość i umocowanie osoby, która sprzedaje.</p>
          <p>Wynik ma postać Raportu Weryfikacyjnego — dokumentu, który kupujący dostaje przed podpisaniem czegokolwiek, z datą, numerem i podpisem.</p>
        </div>
      </div>
    </section>
    <section class="section wrap" aria-labelledby="h-kto">
      <h2 class="h2 reveal" id="h-kto" style="margin-bottom:56px">Kto za co odpowiada</h2>
      <div class="people reveal">${C.osoby.map((o) => `
        <article class="person" aria-labelledby="p-${o.id}">
          ${pic(o.zdjecie, { sizes: '(min-width:768px) 45vw, 100vw', ratio: '4 / 5' })}
          <h3 id="p-${o.id}">${esc(o.imie)} ${esc(o.nazwisko)}</h3>
          <p class="role">${esc(o.rola)}</p>
          <p class="bio">${esc(o.biogram)}</p>
          <p class="scope">Zakres: ${o.zakres.map(esc).join(', ')}.</p>
          <p class="contact num"><a class="tlink" href="tel:${esc(o.telefonHref)}" data-track="call_click">${esc(o.telefon)}</a><a class="tlink" href="mailto:${esc(o.email)}" data-track="email_click">${esc(o.email)}</a></p>
        </article>`).join('')}
      </div>
      <p class="lead reveal" style="margin-top:64px;font-family:var(--f-display);font-size:clamp(1.375rem,1.2rem + .8vw,1.875rem);line-height:1.3;max-width:34ch">${esc(C.zdanieWspolne)}</p>
    </section>
    <section class="section band" aria-labelledby="h-nie"><div class="wrap">
      <div class="split reveal">
        <div class="s-head"><h2 class="h2" id="h-nie">Czego nie robimy</h2></div>
        <div class="s-body prose">
          <p>Nie bierzemy wynagrodzenia od obu stron transakcji. Reprezentujemy jedną i ta jedna wie o tym od początku.</p>
          <p>Nie publikujemy ofert, do których nie mamy umowy z właścicielem.</p>
          <p>Nie obiecujemy ceny ani terminu sprzedaży. Przedstawiamy analizę cenową opartą na cenach transakcyjnych z aktów notarialnych i mówimy, co z niej wynika — także wtedy, gdy jest to niewygodne.</p>
          <p>Nie przyjmujemy spraw, których naszym zdaniem nie da się doprowadzić do końca. Jeśli odmówimy, powiemy dlaczego.</p>
          <h3 class="h3">Sprawy trudne</h3>
          <p>Osobno zajmujemy się nieruchomościami spadkowymi o nieuregulowanym stanie prawnym, z lokatorami, obciążonymi ponad wartość, ze współwłaścicielami w konflikcie. To wymaga miesięcy pracy na dokumentach i cierpliwości wobec ludzi w trudnej sytuacji. Akurat to potrafimy.</p>
        </div>
      </div>
    </div></section>
    <section class="section wrap" aria-label="Przy pracy">
      <div class="grid reveal"><div style="grid-column:1/-1" class="o-desk">${pic('biurko', { sizes: '(min-width:1024px) 50vw, 100vw', ratio: '3 / 2' })}</div></div>
    </section>`,
    after(root) { const d = root.querySelector('.o-desk'); if (d && innerWidth >= 1024) d.style.gridColumn = '7 / span 6'; }
  });

  /* ======================= KONTAKT ======================= */
  P['/kontakt'] = () => ({
    title: T('Kontakt'),
    desc: `Kontakt z AM Nieruchomości: ${C.telefon}, ${C.email}. ${C.godziny}.`,
    crumbs: [['Kontakt', '/kontakt']],
    schema: [agentSchema()],
    html: `
    ${head('Kontakt', 'Kontakt', 'Napisz — odpowiemy w godzinach pracy.')}
    <section class="section wrap" style="padding-top:0" aria-label="Dane i formularz">
      <div class="split reveal">
        <div class="s-head">
          <div class="callbox"><a class="bigtel" href="tel:${esc(C.telefonHref)}" data-track="call_click">${esc(C.telefon)}</a>${mail('tlink bigmail')}</div>
          <table class="kv" style="margin-top:40px"><caption class="visually-hidden">Dane kontaktowe</caption><tbody>
            <tr><th scope="row">Godziny</th><td>${esc(C.godziny)}</td></tr>
            <tr><th scope="row">Adres korespondencyjny</th><td>${esc(C.adresKorespondencyjny)}</td></tr>
            <tr><th scope="row">Obszar działania</th><td>${esc(C.obszar)}</td></tr>
            <tr><th scope="row">NIP</th><td class="num">${esc(C.nip)}</td></tr>
            <tr><th scope="row">Ubezpieczenie OC</th><td>polisa nr <span class="num">${esc(C.polisa.numer)}</span>, ${esc(C.polisa.towarzystwo)}</td></tr>
          </tbody></table>
          <p class="small muted" style="margin-top:20px">Spotykamy się w nieruchomości albo w miejscu ustalonym telefonicznie.</p>
        </div>
        <div class="s-body"><div class="formpanel"><p class="fp-h">Napisz do nas</p>${form({ sciezka: 'kontakt', fields: [{ name: 'temat', label: 'Temat', type: 'select', required: true, options: ['Sprzedaż', 'Raport Weryfikacyjny', 'Sprawa trudna', 'Najem', 'Inne'], err: 'Wybierz temat.' }, FIELD.wiadomosc, FIELD.kontakt], submit: 'Wyślij wiadomość' })}</div></div>
      </div>
    </section>`
  });

  window.AM_PAGES = P;
  window.AM_PAGE_HELPERS = { T, tel, mail, head, formBand, priceCard, rynek, wyn, agentSchema, zasadySheet };
})();
</script>
<script>/* ==========================================================================
   AM Nieruchomości — listing, karta nieruchomości, Wiedza, strony prawne, stany
   ========================================================================== */
(function () {
  'use strict';
  const A = window.AM; const P = window.AM_PAGES; const H = window.AM_PAGE_HELPERS;
  const { C, DATA, esc, L, fmt, form, FIELD, sheet } = A;
  const { T, tel, mail, head } = H;

  /* ======================= LISTING ======================= */
  const FSTATE = Object.assign({ transakcja: '', rodzaj: '', cenaOd: '', cenaDo: '', mOd: '', mDo: '', pokoje: '', dzielnica: '', status: '', widok: 'siatka', zapisane: false }, (function () { try { return JSON.parse(sessionStorage.getItem('am-filtry') || '{}'); } catch (e) { return {}; } })());
  const saveF = () => { try { sessionStorage.setItem('am-filtry', JSON.stringify(FSTATE)); } catch (e) { /* bez pamięci sesji */ } };
  function applyFilters(items) {
    const f = FSTATE; const n = (v) => v === '' ? null : Number(String(v).replace(/\s/g, '').replace(',', '.'));
    return items.filter((p) =>
      (!f.transakcja || p.transakcja === f.transakcja) && (!f.rodzaj || p.rodzaj === f.rodzaj) &&
      (n(f.cenaOd) == null || p.cena >= n(f.cenaOd)) && (n(f.cenaDo) == null || p.cena <= n(f.cenaDo)) &&
      (n(f.mOd) == null || p.metrazAkt >= n(f.mOd)) && (n(f.mDo) == null || p.metrazAkt <= n(f.mDo)) &&
      (!f.pokoje || (f.pokoje === '4+' ? p.pokoje >= 4 : p.pokoje === Number(f.pokoje))) &&
      (!f.dzielnica || p.dzielnica === f.dzielnica) && (!f.status || p.status === f.status) &&
      (!f.zapisane || A.store.get('am-saved', []).includes(p.slug)));
  }
  const opt = (arr, cur) => `<option value="">Wszystkie</option>` + arr.map((v) => `<option ${v === cur ? 'selected' : ''}>${esc(v)}</option>`).join('');
  function filtersHtml(items) {
    const uniq = (k) => [...new Set(items.map((p) => p[k]))].sort();
    const f = FSTATE;
    const flt = (id, label, active, inner) => `<div class="filter"><button type="button" class="${active ? 'active' : ''}" aria-expanded="false" aria-controls="pop-${id}">${label}</button><div class="pop" id="pop-${id}" hidden>${inner}</div></div>`;
    const sel = (name, label, arr) => `<div class="field"><label for="fl-${name}">${label}</label><select class="select" id="fl-${name}" data-f="${name}">${opt(arr, f[name])}</select></div>`;
    const rng = (a, b, label, unit) => `<div class="field"><span class="flabel">${label}</span><div class="range"><label class="visually-hidden" for="fl-${a}">${label} od</label><input class="input num" id="fl-${a}" data-f="${a}" inputmode="numeric" placeholder="od ${unit}" value="${esc(f[a])}"><label class="visually-hidden" for="fl-${b}">${label} do</label><input class="input num" id="fl-${b}" data-f="${b}" inputmode="numeric" placeholder="do ${unit}" value="${esc(f[b])}"></div></div>`;
    return `<div class="filters" role="group" aria-label="Filtry">
      ${flt('tr', 'Sprzedaż / najem', f.transakcja, sel('transakcja', 'Rodzaj transakcji', ['sprzedaż', 'najem']))}
      ${flt('rd', 'Rodzaj', f.rodzaj, sel('rodzaj', 'Rodzaj nieruchomości', ['mieszkanie', 'dom', 'działka', 'lokal użytkowy']))}
      ${flt('cn', 'Cena', f.cenaOd || f.cenaDo, rng('cenaOd', 'cenaDo', 'Cena', 'zł'))}
      ${flt('mt', 'Metraż', f.mOd || f.mDo, rng('mOd', 'mDo', 'Metraż', 'm²'))}
      ${flt('pk', 'Pokoje', f.pokoje, sel('pokoje', 'Liczba pokoi', ['1', '2', '3', '4+']))}
      ${flt('dz', 'Dzielnica', f.dzielnica, sel('dzielnica', 'Dzielnica', uniq('dzielnica')))}
      ${flt('st', 'Status', f.status, sel('status', 'Status', ['Dostępna', 'Zarezerwowana', 'Po akcie notarialnym', 'Wynajęta']))}
      <button type="button" class="fsaved" data-saved-toggle aria-pressed="${!!f.zapisane}">Zapisane (<span class="num">${A.store.get('am-saved', []).length}</span>)</button>
      <div class="viewswitch" role="group" aria-label="Widok">${['siatka', 'lista', 'mapa'].map((v) => `<button type="button" data-view="${v}" aria-pressed="${f.widok === v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div>
    </div>`;
  }
  function resultsHtml(items) {
    const res = applyFilters(items);
    if (!res.length) return `<div class="empty" role="status"><p class="lead" style="margin:0">Na razie nie mamy tu nieruchomości spełniających te kryteria. Zostaw kontakt — napiszemy, gdy pojawi się pasująca.</p>
      ${form({ sciezka: 'powiadomienie', kind: 'notify', fields: [{ name: 'email', label: 'Adres e-mail', type: 'email', required: true, autocomplete: 'email', err: 'Podaj adres e-mail w formacie nazwa@domena.pl.' }], consent: 'Zgadzam się na otrzymywanie powiadomień o nowych nieruchomościach. Mogę zrezygnować w każdej chwili.', submit: 'Powiadamiajcie mnie' })}</div>`;
    const meta = `<p class="results-meta num" role="status">${res.length} ${res.length === 1 ? 'nieruchomość' : (res.length < 5 ? 'nieruchomości' : 'nieruchomości')}${A.podglad() ? ' · podgląd na danych fikcyjnych' : ''}</p>`;
    if (FSTATE.widok === 'mapa') {
      const groups = {}; res.forEach((p) => { (groups[p.dzielnica] = groups[p.dzielnica] || []).push(p); });
      return meta + `<div class="split"><div class="s-head"><div class="mapbox" role="img" aria-label="Schemat obszarów, bez podkładu mapowego">${mapSvg(Object.keys(groups))}</div><p class="small muted" style="margin-top:12px">Lokalizacje przybliżone, bez numerów budynków. Podkład mapowy dołączamy w wersji docelowej serwisu.</p></div>
        <div class="s-body">${Object.entries(groups).map(([d, ps]) => `<h3 class="h3" style="margin:0 0 16px">${esc(d)}</h3><div class="cards list" style="margin-bottom:48px">${ps.map(A.card).join('')}</div>`).join('')}</div></div>`;
    }
    return meta + `<div class="cards ${FSTATE.widok === 'lista' ? 'list' : ''}">${res.map(A.card).join('')}</div>`;
  }
  function mapSvg(labels) {
    const pos = [[30, 40], [62, 30], [48, 66], [76, 62], [22, 72]];
    return `<svg viewBox="0 0 100 56.25" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="100" height="56.25" fill="#131317"/>
      <path d="M0 40 Q30 30 50 36 T100 28" fill="none" stroke="#6E5721" stroke-width=".3"/><path d="M40 0 Q46 20 44 56" fill="none" stroke="#6E5721" stroke-width=".3"/>
      ${labels.map((l, i) => { const [x, y] = pos[i % pos.length]; return `<circle cx="${x}" cy="${y * .5625}" r="6" fill="none" stroke="#C8A44D" stroke-width=".35"/><text x="${x}" y="${y * .5625 + 9.5}" fill="#E8E5DE" font-size="2.6" text-anchor="middle" font-family="Archivo, sans-serif">${esc(l)}</text>`; }).join('')}</svg>`;
  }
  P['/nieruchomosci'] = () => {
    const items = A.listingItems();
    return {
      title: T('Nieruchomości na sprzedaż i wynajem'),
      desc: 'Mieszkania, domy i działki w Lublinie i powiecie lubelskim. Każda nieruchomość sprawdzona prawnie i faktycznie przed publikacją.',
      crumbs: [['Nieruchomości', '/nieruchomosci']],
      noindex: A.podglad(),
      html: `${head('Nieruchomości', 'Nieruchomości', 'Każda sprawdzona przed publikacją. Raport Weryfikacyjny dostępny dla kupującego przed podpisaniem umowy przedwstępnej.')}
        ${A.podglad() ? '<div class="fictbar" role="note">Podgląd trybu ofertowego na nieruchomościach fikcyjnych. Te dane nie są ogłoszeniami.</div>' : ''}
        <section class="wrap" style="padding-bottom:var(--section)" aria-labelledby="wyniki-h"><h2 class="visually-hidden" id="wyniki-h">Wyniki</h2>
          <div id="flt">${filtersHtml(items)}</div><div id="res">${resultsHtml(items)}</div>
        </section>`,
      after(root) {
        const rerender = (keepFocus) => { root.querySelector('#res').innerHTML = resultsHtml(items); A.bindSave(root.querySelector('#res')); A.bindForms(root.querySelector('#res')); root.querySelectorAll('.filter > button').forEach((b) => { const pop = b.nextElementSibling; b.classList.toggle('active', [...pop.querySelectorAll('[data-f]')].some((x) => FSTATE[x.dataset.f])); }); };
        const closeAll = (except) => root.querySelectorAll('.filter > button').forEach((b) => { if (b !== except) { b.setAttribute('aria-expanded', 'false'); b.nextElementSibling.hidden = true; } });
        root.querySelectorAll('.filter > button').forEach((b) => b.addEventListener('click', () => {
          const open = b.getAttribute('aria-expanded') === 'true'; closeAll(b);
          b.setAttribute('aria-expanded', String(!open)); b.nextElementSibling.hidden = open;
          if (!open) { const f = b.nextElementSibling.querySelector('select,input'); f && f.focus(); }
        }));
        root.querySelectorAll('.filter .pop').forEach((pop) => pop.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const b = pop.previousElementSibling; b.setAttribute('aria-expanded', 'false'); pop.hidden = true; b.focus(); } }));
        document.addEventListener('click', A._outside = (e) => { if (!e.target.closest('.filter')) closeAll(); });
        root.querySelectorAll('[data-f]').forEach((el) => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { FSTATE[el.dataset.f] = el.value; saveF(); rerender(); }));
        const sv = root.querySelector('[data-saved-toggle]');

        const close = () => { lb.classList.remove('open'); document.body.style.overflow = ''; untrap && untrap(); opener && opener.focus(); };
        const open = (k, from) => { opener = from; lb.classList.add('open'); document.body.style.overflow = 'hidden'; show(k); untrap = A.trap(lb, close); lb.querySelector('[data-lbclose]').focus(); };

      }

      <tr><th scope="row">Odpowiedź na wiadomość z formularza, e-mail lub telefon</th><td>Zgoda (art. 6 ust. 1 lit. a RODO); gdy wiadomość dotyczy zawarcia umowy — także działania przed zawarciem umowy (lit. b). Do zakończenia korespondencji albo cofnięcia zgody.</td></tr>
      <tr><th scope="row">Zawarcie i wykonanie umowy pośrednictwa lub umowy o Raport Weryfikacyjny</th><td>Art. 6 ust. 1 lit. b RODO. Przez czas trwania umowy, a następnie do upływu okresu przedawnienia roszczeń.</td></tr>
      <tr><th scope="row">Obowiązki wynikające z ustawy o przeciwdziałaniu praniu pieniędzy oraz finansowaniu terroryzmu</th><td>Art. 6 ust. 1 lit. c RODO. Identyfikacja i weryfikacja stron, przechowywanie dokumentacji przez okres wskazany w ustawie (5 lat, licząc od pierwszego dnia roku następującego po roku zakończenia stosunków gospodarczych lub przeprowadzenia transakcji).</td></tr>
      <tr><th scope="row">Obowiązki podatkowe i rachunkowe</th><td>Art. 6 ust. 1 lit. c RODO. Przez okres wymagany przepisami podatkowymi.</td></tr>
      <tr><th scope="row">Ustalenie roszczeń, obrona przed roszczeniami i ich egzekwowanie</th><td>Art. 6 ust. 1 lit. f RODO. Do upływu okresu przedawnienia.</td></tr>
      <tr><th scope="row">Powiadomienia o nowych nieruchomościach</th><td>Zgoda (art. 6 ust. 1 lit. a RODO), potwierdzona linkiem w wiadomości e-mail. Do cofnięcia zgody.</td></tr>
      <tr><th scope="row">Statystyka odwiedzin strony</th><td>Zgoda wyrażona w ustawieniach plików cookies. Do cofnięcia zgody.</td></tr>
    </tbody></table></div>
    <h2 class="sub">3. Dane z rejestrów publicznych</h2>
    <p>Sporządzając Raport Weryfikacyjny, korzystamy z rejestrów publicznych, w tym ksiąg wieczystych i planów zagospodarowania przestrzennego. Dane z tych rejestrów mogą dotyczyć właścicieli nieruchomości. Osoby, których dane pozyskaliśmy w ten sposób, informujemy zgodnie z art. 14 RODO. Do raportu przenosimy wyłącznie dane niezbędne do ustaleń.</p>
    <h2 class="sub">4. Odbiorcy danych</h2>
    <p>Dostawca hostingu i poczty elektronicznej, biuro rachunkowe, ubezpieczyciel odpowiedzialności cywilnej, notariusz w zakresie transakcji, a także organy uprawnione na podstawie przepisów prawa, w tym Generalny Inspektor Informacji Finansowej. [Lista dostawców do uzupełnienia; informacja o przekazywaniu danych poza EOG — po wyborze dostawców.]</p>
    <h2 class="sub">5. Prawa osób, których dane dotyczą</h2>
    <p>Prawo dostępu do danych, ich sprostowania, usunięcia, ograniczenia przetwarzania i przenoszenia, prawo sprzeciwu wobec przetwarzania opartego na prawnie uzasadnionym interesie oraz prawo cofnięcia zgody w dowolnym momencie, bez wpływu na zgodność z prawem przetwarzania przed jej cofnięciem. Przysługuje także prawo wniesienia skargi do Prezesa Urzędu Ochrony Danych Osobowych, ul. Stawki 2, 00-193 Warszawa.</p>
    <h2 class="sub">6. Dobrowolność</h2>
    <p>Podanie danych w formularzu jest dobrowolne, ale bez nich nie możemy odpowiedzieć. Podanie danych wymaganych ustawą o przeciwdziałaniu praniu pieniędzy jest warunkiem zawarcia umowy.</p>
    <h2 class="sub">7. Zautomatyzowane decyzje</h2>
    <p>Nie podejmujemy decyzji opartych wyłącznie na zautomatyzowanym przetwarzaniu, w tym profilowaniu.</p>`, 'Polityka prywatności'), { title: T('Polityka prywatności'), desc: 'Polityka prywatności AM Nieruchomości: administrator, cele i podstawy przetwarzania, okresy, prawa osób.' });

  P['/cookies'] = () => Object.assign(legal('Dane osobowe', 'Pliki cookies', 'Pliki cookies i pamięć przeglądarki', `
    <p style="margin-top:0">Strona zapisuje w przeglądarce tylko to, co opisujemy poniżej. Statystyka odwiedzin działa wyłącznie po wyrażeniu zgody.</p>
    <div class="tablewrap"><table class="kv"><caption class="visually-hidden">Kategorie</caption><tbody>
      <tr><th scope="row">Niezbędne</th><td>Zapis decyzji dotyczącej cookies (pamięć przeglądarki, do 12 miesięcy). Nie wymaga zgody.</td></tr>
      <tr><th scope="row">Funkcjonalne</th><td>Lista zapisanych nieruchomości (pamięć przeglądarki). Zapisuje się tylko po kliknięciu ikony zapisu i zostaje na tym urządzeniu.</td></tr>
      <tr><th scope="row">Analityczne</th><td>Google Analytics 4 w trybie Consent Mode. Domyślnie wyłączone; działa po wyrażeniu zgody.${C.analityka.ga4Id ? '' : ' Obecnie nieuruchomione.'}</td></tr>
    </tbody></table></div>
    <p style="margin-top:24px"><button class="btn btn--secondary" type="button" data-cookieset>Zmień ustawienia cookies</button></p>`, 'Cookies'), { title: T('Pliki cookies'), desc: 'Jakie dane strona zapisuje w przeglądarce i jak zmienić ustawienia.' });

  /* ======================= STANY ======================= */
  P['/dziekujemy'] = () => ({
    title: T('Dziękujemy'), desc: 'Wiadomość wysłana.', noindex: true,
    html: `<section class="state wrap" aria-labelledby="h1"><p class="label">Wiadomość wysłana</p><h1 class="display" id="h1" tabindex="-1" style="margin-top:24px;max-width:16ch">Dziękujemy. Odpowiemy w godzinach pracy.</h1><p class="lead" style="margin-top:32px">Jeśli sprawa jest pilna: ${tel()}.</p><p style="margin-top:32px"><a class="tlink" href="${L('/')}">Strona główna</a></p></section>`
  });
  P['/404'] = () => ({
    title: T('Tej strony nie ma'), desc: 'Nie znaleziono strony.', noindex: true, status: 404,
    html: `<section class="state wrap" aria-labelledby="h1"><p class="code num" aria-hidden="true">404</p><h1 class="h2" id="h1" tabindex="-1" style="margin-top:24px;max-width:22ch">Tej strony nie ma. Mogła zostać przeniesiona albo adres zawiera literówkę.</h1><p style="margin-top:32px"><a class="btn btn--secondary" href="${L('/')}">Strona główna</a></p></section>`
  });
  P['/500'] = () => ({
    title: T('Błąd'), desc: 'Błąd po stronie serwisu.', noindex: true,
    html: `<section class="state wrap" aria-labelledby="h1"><p class="code num" aria-hidden="true">500</p><h1 class="h2" id="h1" tabindex="-1" style="margin-top:24px;max-width:22ch">Coś nie zadziałało po naszej stronie.</h1><p class="lead" style="margin-top:24px">Spróbuj za chwilę albo zadzwoń: ${tel()}.</p><p style="margin-top:32px"><a class="btn btn--secondary" href="${L('/')}">Strona główna</a></p></section>`
  });

  window.AM_KARTA = karta;
})();
</script>
<script>/* ==========================================================================
   AM Nieruchomości — powłoka: nagłówek, stopka, cookies, router, meta, schema
   ========================================================================== */
(function () {
  'use strict';
  const A = window.AM; const P = window.AM_PAGES; const { C, DATA, esc, L } = A;

  function nav() {
    const of = A.tryb() === 'ofertowy';
    const items = of
      ? [['Nieruchomości', '/nieruchomosci'], ['Sprzedaję', '/sprzedaje'], ['Raport Weryfikacyjny', '/raport-weryfikacyjny'], ['Sprawy trudne', '/sprawy-trudne'], ['O nas', '/o-nas']]
      : [['Sprzedaję', '/sprzedaje'], ['Raport Weryfikacyjny', '/raport-weryfikacyjny'], ['Sprawy trudne', '/sprawy-trudne'], ['Najem', '/najem'], ['O nas', '/o-nas']];
    if (DATA.wiedza.artykuly.length) items.push(['Wiedza', '/wiedza']);
    return items;
  }

  function header(path) {
    const cur = (p) => (path === p || (p !== '/' && path.startsWith(p + '/'))) ? 'aria-current="page"' : '';
    return `${C.robocza ? `<div class="draftbar" role="note">Wersja robocza. Dane kontaktowe, NIP i numer polisy są przykładowe.</div>` : ''}
    <header class="site-header">
      <div class="wrap bar">
        <a class="brand" href="${L('/')}" aria-label="${esc(C.nazwa)} — strona główna">${A.logoFull(false)}${A.logoMark(false)}</a>
        <nav class="nav" aria-label="Główna">
          <ul>${nav().map(([t, p]) => `<li><a class="navlink" href="${L(p)}" ${cur(p)}>${t}</a></li>`).join('')}</ul>
          <a class="btn btn--secondary btn--small" href="${L('/kontakt')}" ${cur('/kontakt')}>Kontakt</a>
        </nav>
        <div class="m-actions">
          <a class="iconbtn" href="tel:${esc(C.telefonHref)}" data-track="call_click" aria-label="Zadzwoń: ${esc(C.telefon)}">${A.I.phone}</a>
          <button class="iconbtn" type="button" data-menu aria-expanded="false" aria-controls="mmenu" aria-label="Menu">${A.I.menu}</button>
        </div>
      </div>
    </header>
    <div class="mmenu" id="mmenu" role="dialog" aria-modal="true" aria-label="Menu">
      <div class="top">${A.logoMark(true)}<button class="iconbtn" type="button" data-menuclose aria-label="Zamknij menu">${A.I.close}</button></div>
      <nav aria-label="Główna, wersja mobilna"><ul>${nav().concat([['Kontakt', '/kontakt']]).map(([t, p], i) => `<li style="--i:${i}"><a href="${L(p)}" ${cur(p)}><span class="mi" aria-hidden="true">${i + 1}</span>${t}</a></li>`).join('')}</ul></nav>
      <div class="foot num"><a class="btn btn--primary" href="tel:${esc(C.telefonHref)}" data-track="call_click">Zadzwoń: ${esc(C.telefon)}</a><a class="tlink" href="mailto:${esc(C.email)}" data-track="email_click">${esc(C.email)}</a><span class="small muted">${esc(C.godziny)}</span></div>
    </div>`;
  }

  function footer() {
    const of = A.tryb() === 'ofertowy';
    return `<footer class="site-footer">
      <div class="wrap">
        <div class="fgrid">
          <div class="fbrand">${A.logoFull(true)}<p class="slogan">${esc(C.haslo)}</p></div>
          <div class="fdata"><h2 class="visually-hidden">Dane firmy</h2><dl>
            <dt>Przedsiębiorca</dt><dd>${esc(C.przedsiebiorca)}</dd>
            <dt>Telefon</dt><dd><a class="tlink" href="tel:${esc(C.telefonHref)}" data-track="call_click">${esc(C.telefon)}</a></dd>
            <dt>E-mail</dt><dd><a class="tlink" href="mailto:${esc(C.email)}" data-track="email_click">${esc(C.email)}</a></dd>
            <dt>Adres korespondencyjny</dt><dd>${esc(C.adresKorespondencyjny)}</dd>
            <dt>NIP</dt><dd>${esc(C.nip)}</dd>
            <dt>Ubezpieczenie OC</dt><dd>Ubezpieczenie OC pośrednika w obrocie nieruchomościami, polisa nr ${esc(C.polisa.numer)}, ${esc(C.polisa.towarzystwo)}</dd>
            <dt>Obszar działania</dt><dd>${esc(C.obszar)}</dd>
            <dt>Godziny</dt><dd>${esc(C.godziny)}</dd>
          </dl></div>
          <nav class="flinks" aria-label="Stopka"><ul>
            ${of ? `<li><a href="${L('/najem')}">Najem</a></li>` : ''}
            <li><a href="${L('/kontakt')}">Kontakt</a></li>
            <li><a href="${L('/zasady-wspolpracy')}">Zasady współpracy</a></li>
            <li><a href="${L('/polityka-prywatnosci')}">Polityka prywatności</a></li>
            <li><a href="${L('/cookies')}">Pliki cookies</a></li>
            <li><button type="button" data-cookieset>Ustawienia cookies</button></li>
          </ul></nav>
        </div>
        <div class="fbottom"><span>${esc(C.nazwa)} · ${esc(C.obszar)}</span><span>Michał Lewandowski · Agata Ceglińska</span></div>
      </div>
    </footer>`;
  }

  /* ---------- Cookies ---------- */
  function cookieUI() {
    return `<div class="cookiebar" id="cookiebar" role="region" aria-label="Pliki cookies" hidden>
      <div class="inner"><p>Używamy plików niezbędnych do działania strony. Statystykę odwiedzin włączymy tylko za Twoją zgodą. <a class="tlink" href="${L('/cookies')}">Szczegóły</a></p>
      <div class="btnrow"><button class="btn btn--secondary btn--small" type="button" data-ck="accept">Akceptuję</button><button class="btn btn--secondary btn--small" type="button" data-ck="reject">Odrzucam</button><button class="btn btn--small tlink" style="background:none;border:0" type="button" data-cookieset>Ustawienia</button></div></div>
    </div>
    <div class="dialog" id="ckdialog" role="dialog" aria-modal="true" aria-labelledby="ck-h">
      <div class="panel"><h2 id="ck-h">Ustawienia cookies</h2>
        <div class="toggle"><div><strong style="font-weight:600">Niezbędne</strong><p>Zapis Twojej decyzji. Zawsze włączone.</p></div><input class="switch" type="checkbox" checked disabled aria-label="Niezbędne, zawsze włączone"></div>
        <div class="toggle"><div><label for="ck-an"><strong style="font-weight:600">Statystyka odwiedzin</strong></label><p>Google Analytics 4 w trybie Consent Mode.</p></div><input class="switch" id="ck-an" type="checkbox"></div>
        <div class="btnrow" style="margin-top:24px"><button class="btn btn--primary" type="button" data-ck="save">Zapisz wybór</button><button class="btn btn--secondary" type="button" data-ck="close">Anuluj</button></div>
      </div>
    </div>`;
  }
  let ckUntrap = null, ckOpener = null;
  function openCk(from) {
    const d = document.getElementById('ckdialog'); ckOpener = from;
    d.querySelector('#ck-an').checked = !!(A.store.get('am-consent', {}).analytics);
    d.classList.add('open'); ckUntrap = A.trap(d, closeCk); d.querySelector('#ck-an').focus();
  }
  function closeCk() { const d = document.getElementById('ckdialog'); d.classList.remove('open'); ckUntrap && ckUntrap(); ckOpener && ckOpener.focus && ckOpener.focus(); }
  function setConsent(an) { const c = { analytics: an, ts: Date.now() }; A.store.set('am-consent', c); A.applyConsent(c); document.getElementById('cookiebar').hidden = true; }
  function initCookies() {
    const c = A.store.get('am-consent', null);
    if (c) A.applyConsent(c); else document.getElementById('cookiebar').hidden = false;
    document.addEventListener('click', (e) => {
      const set = e.target.closest('[data-cookieset]'); if (set) { openCk(set); return; }
      const b = e.target.closest('[data-ck]'); if (!b) return;
      const a = b.dataset.ck;
      if (a === 'accept') setConsent(true); else if (a === 'reject') setConsent(false);
      else if (a === 'save') { setConsent(document.getElementById('ck-an').checked); closeCk(); }
      else if (a === 'close') closeCk();
    });
  }

  /* ---------- Meta ---------- */
  function setMeta(name, val, attr = 'name') {
    let m = document.head.querySelector(`meta[${attr}="${name}"]`);
    if (!m) { m = document.createElement('meta'); m.setAttribute(attr, name); document.head.appendChild(m); }
    m.setAttribute('content', val);
  }
  function applyMeta(page, path) {
    document.title = page.title;
    setMeta('description', page.desc || '');
    setMeta('robots', (C.robocza || page.noindex) ? 'noindex, nofollow' : 'index, follow');
    setMeta('og:title', page.title, 'property'); setMeta('og:description', page.desc || '', 'property');
    setMeta('og:url', C.domena + (path === '/' ? '/' : path), 'property');
    let can = document.head.querySelector('link[rel="canonical"]');
    if (!can) { can = document.createElement('link'); can.rel = 'canonical'; document.head.appendChild(can); }
    can.href = C.domena + (path === '/' ? '/' : path);
    const ld = [].concat(page.schema || []);
    if (page.crumbs && page.crumbs.length) ld.push({ '@context': 'https://schema.org', '@type': 'BreadcrumbList', itemListElement: [['Strona główna', '/']].concat(page.crumbs).map(([n, u], i) => ({ '@type': 'ListItem', position: i + 1, name: n, item: C.domena + (u || path) })) });
    let s = document.getElementById('ld'); if (!s) { s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'ld'; document.head.appendChild(s); }
    s.textContent = JSON.stringify(ld.length === 1 ? ld[0] : ld);
  }

  /* ---------- Router ---------- */
  function parse() {
    const h = location.hash || '#/';
    if (!h.startsWith('#/')) return null;
    const [p, qs] = h.slice(1).split('?');
    const q = {}; (qs || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); q[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    return { path: p.replace(/\/+$/, '') || '/', q };
  }
  let menuUntrap = null;
  function render(first) {
    const r = parse(); if (!r) return;
    if (r.q.tryb === 'ofertowy') A.sstore.set('am-tryb', 'ofertowy');
    if (r.q.tryb === 'startowy') A.sstore.set('am-tryb', '');
    if (A._outside) { document.removeEventListener('click', A._outside); A._outside = null; }
    let page;
    try {
      if (r.path.startsWith('/nieruchomosci/')) page = window.AM_KARTA(r.path.split('/')[2], r.q);
      else if (P[r.path]) page = P[r.path]();
      if (!page) page = P['/404']();
    } catch (err) { console.error(err); page = P['/500'](); }
    const app = document.getElementById('app');
    app.innerHTML = header(r.path) + `<main id="main" tabindex="-1">${page.html}</main>` + footer();
    document.body.className = page.bodyClass || '';
    applyMeta(page, r.path);
    const ph = app.querySelector('main > .pagehead');
    const hs = [...app.querySelectorAll('main .split > .s-head > .h2[id]:first-child:not(.nonum), main .shead > .h2[id]:first-child:not(.nonum)')];
    if (ph && hs.length >= 3) ph.insertAdjacentHTML('afterend', `<nav class="ptoc-wrap wrap" aria-label="Na tej stronie"><div class="ptoc"><ol>${hs.map((h, i) => `<li><a href="#${h.id}"><span class="ri" aria-hidden="true">${i + 1}</span>${esc(h.textContent)}</a></li>`).join('')}</ol></div></nav>`);
    A.bindForms(app); A.bindSave(app); A.imgLoaded(app); A.reveal(app);
    page.after && page.after(app);
    // menu mobilne
    const mm = app.querySelector('#mmenu'); const mb = app.querySelector('[data-menu]');
    const closeM = () => { mm.classList.remove('open'); mb.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; menuUntrap && menuUntrap(); mb.focus(); };
    mb.addEventListener('click', () => { mm.classList.add('open'); mb.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; menuUntrap = A.trap(mm, closeM); mm.querySelector('[data-menuclose]').focus(); });
    mm.querySelector('[data-menuclose]').addEventListener('click', closeM);
    mm.querySelectorAll('nav a').forEach((a) => a.addEventListener('click', () => { document.body.style.overflow = ''; }));
    // przewinięcie i fokus
    if (r.q.do) { const t = document.getElementById(r.q.do); if (t) { t.scrollIntoView(); const f = t.querySelector('input,select,textarea'); f && f.focus({ preventScroll: true }); return; } }
    window.scrollTo(0, 0);
    if (!first) { const h1 = document.getElementById('h1'); (h1 || document.getElementById('main')).focus({ preventScroll: true }); }
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (a && !a.getAttribute('href').startsWith('#/')) {
      e.preventDefault();
      const t = document.getElementById(a.getAttribute('href').slice(1));
      if (t) { t.scrollIntoView(); if (t.tabIndex < 0 && !/^(A|BUTTON|INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) t.setAttribute('tabindex', '-1'); const f = t.id === 'main' ? t : (t.querySelector('input,select,textarea') || t); f.focus({ preventScroll: true }); }
      return;
    }
    const tr = e.target.closest('[data-track]');
    if (tr) A.track(tr.dataset.track, { page: (parse() || {}).path });
  });

  document.addEventListener('DOMContentLoaded', () => {
    document.documentElement.classList.remove('no-js');
    document.getElementById('shell-extra').innerHTML = cookieUI();
    initCookies();
    if (!location.hash) history.replaceState(null, '', '#/');
    render(true);
  });
  window.addEventListener('hashchange', () => render(false));
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
